name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface ALL platform/Node failures in one run instead of cancelling
      # sibling jobs — a cancelled job hides cross-platform failures (a Windows-
      # only failure stayed invisible behind Linux failures during the 1.8.0
      # CI repair, costing an extra round-trip). See pln#536 / trp#482.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 20 EOL 2026-04 and removed from GitHub runners 2026-09-16.
        # 22 = Active LTS (until 2026-10), 24 = current Active LTS — the two
        # versions a user could rationally run today. pln#459.
        node: [22, 24]
        exclude:
          # Windows runs only on the newer LTS to keep job count down; Linux
          # provides full coverage across both supported Node versions.
          - os: windows-latest
            node: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Mojibake guard
        run: node scripts/check-mojibake.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build tests
        run: npm run build:test

      - name: Coverage gate
        run: >
          npx c8
          --all
          --check-coverage
          --lines 55
          --functions 60
          --branches 65
          --statements 55
          --src dist-test/src
          --reporter=text-summary
          --exclude=dist-test/tests/**
          --exclude=dist-test/scripts/**
          node scripts/run-tests.mjs default

  e2e:
    name: E2E Tests (Linux, Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tests
        run: npm run build:test

      - name: Run e2e tests
        run: node scripts/run-tests.mjs e2e
