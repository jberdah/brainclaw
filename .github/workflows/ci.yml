name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build tests
        run: npm run build:test

      - name: Run tests
        run: node scripts/run-tests.mjs default

      - name: Coverage gate
        run: >
          npx c8
          --all
          --check-coverage
          --lines 55
          --functions 60
          --branches 65
          --statements 55
          --src dist-test/src
          --reporter=text-summary
          --exclude=dist-test/tests/**
          --exclude=dist-test/scripts/**
          node scripts/run-tests.mjs default
