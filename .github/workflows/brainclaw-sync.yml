name: brainclaw-sync

on:
  push:
    branches:
      - main
    paths:
      - '.brainclaw/**'
  schedule:
    # Daily health check at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    name: Memory Sync & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Run doctor check
        id: doctor
        run: |
          set +e
          node dist/cli.js doctor --json > doctor_output.json 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat doctor_output.json
          set -e

      - name: Parse doctor results
        id: results
        run: |
          OK=$(node -e "const d = require('./doctor_output.json'); console.log(d.ok ? 'true' : 'false')" 2>/dev/null || echo "false")
          METRICS=$(node -e "const d = require('./doctor_output.json'); const m = d.metrics; console.log(\`pending=\${m.pending_candidates}, active_plans=\${m.active_plan_items}, overdue=\${m.pending_overdue}\`)" 2>/dev/null || echo "metrics unavailable")
          echo "ok=$OK" >> $GITHUB_OUTPUT
          echo "metrics=$METRICS" >> $GITHUB_OUTPUT

      - name: Memory health summary
        run: |
          echo "## Memory Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.results.outputs.ok }}" = "true" ]; then
            echo "✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Issues detected — review doctor output above" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Metrics:** ${{ steps.results.outputs.metrics }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generated by brainclaw on $(date -u '+%Y-%m-%d %H:%M UTC')_" >> $GITHUB_STEP_SUMMARY

      - name: Fail on critical doctor issues
        if: steps.results.outputs.ok == 'false'
        run: |
          echo "Doctor check found issues. Review the output above."
          # Only fail on error-level checks, not warnings
          ERRORS=$(node -e "const d = require('./doctor_output.json'); const errs = (d.checks || []).filter(c => c.status === 'error'); console.log(errs.length)" 2>/dev/null || echo "0")
          if [ "$ERRORS" -gt "0" ]; then
            echo "Found $ERRORS error-level check(s). Failing workflow."
            exit 1
          fi
          echo "Only warnings found — workflow continues."
