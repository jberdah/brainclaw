version: 2
updates:
  # Root package (the published CLI / MCP server).
  # Group low-risk bumps into one PR each; majors stay individual so a runtime
  # breaking change (e.g. commander 14→15, which forced a Node floor bump) gets
  # its own review instead of riding along in a batch.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # web-tree-sitter 0.26 ships a new tree-sitter ABI that can't load the
      # grammar .wasm files from tree-sitter-wasms (built with tree-sitter-cli
      # 0.20.x) — Code Map fails to load grammars at runtime. It also moved
      # tree-sitter.wasm out of its exports map, breaking copy-code-map-wasm.mjs.
      # Pin to 0.25.x until the grammars are rebuilt against the new ABI.
      - dependency-name: "web-tree-sitter"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # TypeScript 7 (native compiler) — validated 2026-07-31 in an isolated
      # spike (PR #56 closing comment): OUR code compiles clean and 2.6x faster,
      # dist/ .js output byte-identical, BUT typescript-eslint 8.61 hard-crashes
      # at require time against the native compiler's API (typescript-estree,
      # eslint exit 2), breaking `npm run lint`. The blocker is upstream, not
      # this codebase. Lift this ignore when typescript-eslint ships TS7
      # support; the vscode-extension (no typescript-eslint) already runs TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # VS Code extension (separate toolchain + lockfile).
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode must track engines.vscode (^1.85.0). Newer typings raise
      # the minimum VS Code version and fail the Release Package Check build.
      # Bump this manually only when intentionally raising the VS Code floor.
      - dependency-name: "@types/vscode"
    groups:
      vscode-extension-dependencies:
        update-types: ["minor", "patch"]

  # GitHub Actions used by CI + release workflows. Action majors are low-risk
  # (pinned to a maintained action), so batch all update types together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: ["minor", "patch", "major"]
